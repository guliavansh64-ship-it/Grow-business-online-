<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>{{title}}</title>
<meta name="description" content="{{description}}"/>
<meta name="author" content="GrowBusiness Online"/>
<meta name="theme-color" content="#6D5EF6"/>
<meta name="robots" content="{{robots}}"/>
<link rel="canonical" href="{{canonical}}"/>

<!-- Open Graph / Twitter -->
<meta property="og:site_name" content="GrowBusiness Online"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="{{title}}"/>
<meta property="og:description" content="{{description}}"/>
<meta property="og:url" content="{{canonical}}"/>
<meta property="og:image" content="{{ogImage}}"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="{{title}}"/>
<meta name="twitter:description" content="{{description}}"/>
<meta name="twitter:image" content="{{ogImage}}"/>

<!-- Icons -->
<link rel="icon" href="{{prefix}}assets/icons/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="{{prefix}}assets/icons/apple-touch-icon.svg"/>

<!-- Fonts: Inter for UI, Sora for display. System fallbacks keep it fast offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"/>

<!-- Styles -->
<link rel="stylesheet" href="{{prefix}}css/global.css"/>
<link rel="stylesheet" href="{{prefix}}css/components.css"/>
<link rel="stylesheet" href="{{prefix}}css/site.css"/>
<link rel="stylesheet" href="{{prefix}}css/storefront.css"/>
<link rel="stylesheet" href="{{prefix}}css/dashboard.css"/>
<link rel="stylesheet" href="{{prefix}}css/responsive.css"/>

<!-- Paint the saved theme before first render so there is no flash -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('gbo:theme');
      if (!t) t = 'light';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
{{head}}
</head>
<body class="{{bodyClass}}">
<a class="skip-link" href="#main">Skip to content</a>
{{body}}
<script type="module" src="{{prefix}}js/boot.js" data-page="{{page}}"></script>
</body>
</html>
