<!-- Paint the saved theme before first render so there is no flash -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('gbo:theme');
      if (!t) t = 'light';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>

</head>
<body class="">
<a class="skip-link" href="#main">Skip to content</a>
<!-- Vendor console shell.
     mountDashboardChrome() fills [data-app-shell] with the sidebar + topbar and
     moves everything inside <main> into the scroll area, so page modules only
     have to render their own content. -->
<div data-app-shell></div>

<main id="main" class="app-content">
  <noscript>
    <div class="container section">
      <h1>Notifications · Vendor Console | GrowBusiness Online</h1>

  <div class="container section">

    <div class="skeleton sk-card mt-4" style="height:280px"></div>
    <div class="skeleton sk-card mt-4" style="height:200px"></div>
  </div>
</main>

<script type="module" src="../js/boot.js" data-page="dash-notifications"></script>
</body>
